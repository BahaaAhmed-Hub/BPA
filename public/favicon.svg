<!-- The Be mark, amber, at favicon size. Geometry from the design handoff:
     ground #E9A23B, word #050505, dot #F2F2F8, radius scaled from 16 @148.
     The text is Instrument Sans by name; a tab that does not have it falls
     back to the system stack at the same metrics. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 148 148" role="img" aria-label="Be">
  <rect x="0" y="0" width="148" height="148" rx="16" fill="#E9A23B"/>
  <text x="27" y="101.5" font-family="Instrument Sans, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-4.56" fill="#050505">Be</text>
  <rect x="112" y="92.5" width="9" height="9" rx="2" fill="#F2F2F8"/>
</svg>
