name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # Its own secret list is part of what it deploys: changing which keys are
      # asserted has to be able to reach the project without waiting for an
      # unrelated change to a function.
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ─── The secrets the functions read at run time ───────────────────────
      #
      # `ANTHROPIC_API_KEY` is what the Telegram bot and Siri present to
      # Anthropic. It used to be the one secret here set purely by hand, so
      # rotating the key left it holding the revoked value while every other
      # secret stayed correct — which is how the bot came to answer "my key was
      # refused" while nothing looked wrong anywhere else. One home for it now,
      # re-asserted on every deploy.
      #
      # It is NOT the key that was taken out of the web bundle. That one was
      # `VITE_ANTHROPIC_API_KEY`, read by Vite at build time and inlined into a
      # JavaScript file served on a public Pages site. This is handed to the
      # Supabase CLI at deploy time and never reaches a browser.
      #
      # **A missing GitHub secret must never wipe a working one.**
      # `supabase secrets set X=` sets X to the empty string, and the old form
      # interpolated `${{ secrets.X }}` straight into the command — so a secret
      # that had not been created in GitHub silently blanked the live value on
      # the next deploy, which is a worse failure than the one this fixes. Each
      # key is named only when this run actually has it, and the values arrive
      # through `env` rather than being pasted into the script. That is the
      # shape `supabase-deploy.yml` already used for the Google pair.
      - name: Set Edge Function secrets
        env:
          GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          add () {   # add NAME VALUE — only when the value is really there
            if [ -n "${2:-}" ]; then
              args+=("$1=$2")
            else
              echo "::warning::$1 is not set in GitHub secrets — leaving the existing Supabase secret alone."
            fi
          }
          add GOOGLE_CLIENT_ID     "${GOOGLE_CLIENT_ID:-}"
          add GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
          add ANTHROPIC_API_KEY    "${ANTHROPIC_API_KEY:-}"

          if [ ${#args[@]} -eq 0 ]; then
            echo "No secrets to set — nothing in GitHub to assert. Skipping."
            exit 0
          fi
          supabase secrets set "${args[@]}" --project-ref "$SUPABASE_PROJECT_REF"
          # Names only. Never echo a value.
          echo "Set: $(printf '%s\n' "${args[@]}" | cut -d= -f1 | tr '\n' ' ')"


      - name: Deploy google-token-refresh
        run: |
          supabase functions deploy google-token-refresh \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # `--no-verify-jwt` because the nightly caller is pg_cron, which has no
      # user session to present. The gateway would reject it before the function
      # ran; the function does its own auth instead — a cron secret or a
      # signed-in user, and 401 for anything else.
      - name: Deploy mail-smart-run
        run: |
          supabase functions deploy mail-smart-run \
            --no-verify-jwt \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── The bots ────────────────────────────────────────────────────────────
      # These two were never in any workflow, so every change to them since they
      # were written has been deployed by hand or not at all — which is why a
      # merged fix could sit on main and the bot kept its old behaviour.
      #
      # `--no-verify-jwt` for both: Telegram's webhook POSTs with no Supabase
      # session, and a Siri Shortcut is a plain URL. The gateway would reject
      # them before the function ran. Neither is unauthenticated — each resolves
      # a `prof_sk_` token of its own (the chat's linked token for Telegram, the
      # `?token=`/Bearer one for Siri) and answers nothing without a valid one.
      - name: Deploy telegram-bot
        run: |
          supabase functions deploy telegram-bot \
            --no-verify-jwt \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy professor-siri
        run: |
          supabase functions deploy professor-siri \
            --no-verify-jwt \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
