<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d10"/>
      <stop offset="50%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0e0d10"/>
    </linearGradient>
    <radialGradient id="glow3" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a1830" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="280" fill="url(#dg)"/>
  <rect width="800" height="280" fill="url(#glow3)"/>

  <!-- Mountain backdrop -->
  <path d="M0 200 L100 100 L200 160 L300 80 L400 140 L500 60 L600 120 L700 90 L800 150 L800 280 L0 280Z" fill="#0d0c14" opacity="0.7"/>
  <path d="M0 240 L150 170 L300 210 L450 155 L600 200 L750 170 L800 200 L800 280 L0 280Z" fill="#0a0912" opacity="0.8"/>

  <!-- Battle flag - left side -->
  <line x1="160" y1="260" x2="160" y2="60" stroke="#2a2535" stroke-width="4"/>
  <path d="M160 60 L160 130 L230 95 Z" fill="#1e1c2e"/>
  <!-- Mon (family crest) on flag -->
  <circle cx="192" cy="95" r="18" fill="none" stroke="#3a3550" stroke-width="2" opacity="0.8"/>
  <circle cx="192" cy="95" r="8" fill="#2a2840" opacity="0.6"/>
  <path d="M184 95 Q192 82 200 95 Q192 108 184 95Z" fill="#3a3550" opacity="0.7"/>

  <!-- Battle flag - right side -->
  <line x1="640" y1="260" x2="640" y2="70" stroke="#2a2535" stroke-width="4"/>
  <path d="M640 70 L640 145 L710 107 Z" fill="#1e1c2e"/>
  <circle cx="673" cy="108" r="18" fill="none" stroke="#3a3550" stroke-width="2" opacity="0.8"/>
  <circle cx="673" cy="108" r="8" fill="#2a2840" opacity="0.6"/>
  <path d="M665 108 Q673 95 681 108 Q673 121 665 108Z" fill="#3a3550" opacity="0.7"/>

  <!-- Seated Daimyo figure - commanding posture -->
  <!-- Floor/platform -->
  <rect x="300" y="230" width="200" height="15" rx="2" fill="#1a1828" opacity="0.8"/>
  <rect x="280" y="242" width="240" height="8" rx="1" fill="#14121e" opacity="0.6"/>

  <!-- Seated legs/hakama -->
  <path d="M355 240 Q360 200 365 185 L400 182 L435 185 Q440 200 445 240 Z" fill="#16141f"/>
  <!-- Body - elaborate armor -->
  <rect x="365" y="130" width="70" height="60" rx="5" fill="#1a1828"/>
  <!-- Chest armor plates -->
  <rect x="370" y="136" width="60" height="50" rx="3" fill="#14121e"/>
  <line x1="370" y1="148" x2="430" y2="148" stroke="#2a2840" stroke-width="1.5" opacity="0.8"/>
  <line x1="370" y1="160" x2="430" y2="160" stroke="#2a2840" stroke-width="1.5" opacity="0.7"/>
  <line x1="370" y1="172" x2="430" y2="172" stroke="#2a2840" stroke-width="1.5" opacity="0.6"/>
  <!-- Blue accent on armor -->
  <path d="M370 136 L430 136" stroke="#4040a0" stroke-width="2" opacity="0.6"/>
  <path d="M370 186 L430 186" stroke="#4040a0" stroke-width="1.5" opacity="0.5"/>

  <!-- Large shoulder guards -->
  <rect x="340" y="128" width="28" height="40" rx="4" fill="#1a1828"/>
  <path d="M340 128 L368 128 L368 132 L340 132Z" fill="#4040a0" opacity="0.5"/>
  <rect x="432" y="128" width="28" height="40" rx="4" fill="#1a1828"/>
  <path d="M432 128 L460 128 L460 132 L432 132Z" fill="#4040a0" opacity="0.5"/>

  <!-- Arms resting on knees -->
  <rect x="345" y="165" width="22" height="50" rx="4" fill="#16141f"/>
  <rect x="433" y="165" width="22" height="50" rx="4" fill="#16141f"/>
  <!-- Hands -->
  <ellipse cx="356" cy="218" rx="10" ry="7" fill="#1a1828"/>
  <ellipse cx="444" cy="218" rx="10" ry="7" fill="#1a1828"/>
  <!-- Sword across lap -->
  <line x1="320" y1="210" x2="480" y2="200" stroke="#5a6a8a" stroke-width="2.5"/>
  <rect x="385" y="200" width="30" height="8" rx="3" fill="#2a2030" transform="rotate(-3 400 204)"/>

  <!-- Neck + head -->
  <rect x="390" y="112" width="20" height="20" rx="2" fill="#18161f"/>
  <!-- Helmet - kabuto with large crest -->
  <ellipse cx="400" cy="103" rx="30" ry="22" fill="#1a1828"/>
  <path d="M370 103 Q378 82 400 78 Q422 82 430 103" fill="#14121e"/>
  <!-- Helmet crest - kuwagata (horns) -->
  <path d="M385 80 Q375 55 382 45 Q390 60 392 78" fill="#1a1828" stroke="#4040a0" stroke-width="1.5"/>
  <path d="M415 80 Q425 55 418 45 Q410 60 408 78" fill="#1a1828" stroke="#4040a0" stroke-width="1.5"/>
  <!-- Face guard -->
  <ellipse cx="400" cy="108" rx="20" ry="16" fill="#121020"/>
  <!-- Stern eyes -->
  <ellipse cx="393" cy="104" rx="4" ry="2.5" fill="#3a3880" opacity="0.9"/>
  <ellipse cx="407" cy="104" rx="4" ry="2.5" fill="#3a3880" opacity="0.9"/>

  <!-- Ambient glow under figure -->
  <ellipse cx="400" cy="248" rx="100" ry="12" fill="#1a1830" opacity="0.4" filter="url(#blur3)"/>

  <!-- Subtle clouds -->
  <ellipse cx="250" cy="50" rx="80" ry="20" fill="#14121e" opacity="0.4" filter="url(#blur4)"/>
  <ellipse cx="600" cy="40" rx="90" ry="18" fill="#14121e" opacity="0.3" filter="url(#blur4)"/>

  <!-- Bottom fade -->
  <rect x="0" y="220" width="800" height="60" fill="url(#dg)" opacity="0.55"/>
</svg>
