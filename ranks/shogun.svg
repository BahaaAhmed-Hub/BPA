<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <radialGradient id="shg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#180a0a"/>
      <stop offset="100%" stop-color="#080404"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B1A1A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5a0f0f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B1A1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurS"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glowS"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="280" fill="url(#shg)"/>

  <!-- Dramatic red glow from below -->
  <rect width="800" height="280" fill="url(#fire)"/>

  <!-- Battle banners - multiple -->
  <line x1="100" y1="0" x2="100" y2="280" stroke="#1e0a0a" stroke-width="5" opacity="0.7"/>
  <rect x="100" y="20" width="55" height="80" fill="#1a0808" opacity="0.7"/>
  <rect x="100" y="22" width="55" height="4" fill="#8B1A1A" opacity="0.6"/>

  <line x1="220" y1="0" x2="220" y2="280" stroke="#1e0a0a" stroke-width="4" opacity="0.5"/>
  <rect x="220" y="30" width="45" height="65" fill="#1a0808" opacity="0.5"/>

  <line x1="700" y1="0" x2="700" y2="280" stroke="#1e0a0a" stroke-width="5" opacity="0.7"/>
  <rect x="645" y="20" width="55" height="80" fill="#1a0808" opacity="0.7"/>
  <rect x="645" y="22" width="55" height="4" fill="#8B1A1A" opacity="0.6"/>

  <line x1="580" y1="0" x2="580" y2="280" stroke="#1e0a0a" stroke-width="4" opacity="0.5"/>
  <rect x="535" y="30" width="45" height="65" fill="#1a0808" opacity="0.5"/>

  <!-- Mon crest on main banners -->
  <circle cx="127" cy="65" r="18" fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.7"/>
  <circle cx="127" cy="65" r="10" fill="#5a1010" opacity="0.5"/>
  <path d="M118 65 Q127 52 136 65 Q127 78 118 65Z" fill="#8B1A1A" opacity="0.6"/>

  <circle cx="673" cy="65" r="18" fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.7"/>
  <circle cx="673" cy="65" r="10" fill="#5a1010" opacity="0.5"/>
  <path d="M664 65 Q673 52 682 65 Q673 78 664 65Z" fill="#8B1A1A" opacity="0.6"/>

  <!-- Ground fires / embers -->
  <ellipse cx="200" cy="265" rx="30" ry="10" fill="#8B1A1A" opacity="0.3" filter="url(#blurS)"/>
  <ellipse cx="600" cy="265" rx="30" ry="10" fill="#8B1A1A" opacity="0.3" filter="url(#blurS)"/>
  <ellipse cx="400" cy="270" rx="50" ry="12" fill="#6b1010" opacity="0.25" filter="url(#blurS)"/>

  <!-- Shogun figure - supreme commander, standing tall, full armor -->
  <!-- Massive platform/steps -->
  <rect x="330" y="238" width="140" height="12" rx="1" fill="#1a0808"/>
  <rect x="345" y="248" width="110" height="8" rx="1" fill="#150606"/>
  <rect x="360" y="254" width="80" height="6" rx="1" fill="#120505"/>

  <!-- Legs/hakama - wide and imposing -->
  <path d="M368 242 Q372 200 375 182 L400 178 L425 182 Q428 200 432 242Z" fill="#180808"/>

  <!-- Heavy body armor -->
  <rect x="360" y="118" width="80" height="68" rx="6" fill="#1e0c0c"/>
  <!-- Overlapping lamellar armor plates -->
  <rect x="364" y="125" width="72" height="56" rx="4" fill="#180a0a"/>
  <line x1="364" y1="138" x2="436" y2="138" stroke="#3a0808" stroke-width="2"/>
  <line x1="364" y1="150" x2="436" y2="150" stroke="#3a0808" stroke-width="2"/>
  <line x1="364" y1="162" x2="436" y2="162" stroke="#3a0808" stroke-width="2"/>
  <line x1="364" y1="174" x2="436" y2="174" stroke="#3a0808" stroke-width="1.5"/>
  <!-- Blood red chest detail -->
  <rect x="382" y="128" width="36" height="6" rx="1" fill="#8B1A1A" opacity="0.7"/>
  <rect x="382" y="138" width="36" height="3" rx="1" fill="#6b1010" opacity="0.5"/>

  <!-- Very large shoulder guards (ō-sode) -->
  <rect x="325" y="112" width="38" height="52" rx="5" fill="#1e0c0c"/>
  <line x1="325" y1="122" x2="363" y2="122" stroke="#8B1A1A" stroke-width="1.5" opacity="0.6"/>
  <line x1="325" y1="132" x2="363" y2="132" stroke="#3a0808" stroke-width="1" opacity="0.7"/>
  <line x1="325" y1="142" x2="363" y2="142" stroke="#3a0808" stroke-width="1" opacity="0.6"/>
  <rect x="437" y="112" width="38" height="52" rx="5" fill="#1e0c0c"/>
  <line x1="437" y1="122" x2="475" y2="122" stroke="#8B1A1A" stroke-width="1.5" opacity="0.6"/>
  <line x1="437" y1="132" x2="475" y2="132" stroke="#3a0808" stroke-width="1" opacity="0.7"/>
  <line x1="437" y1="142" x2="475" y2="142" stroke="#3a0808" stroke-width="1" opacity="0.6"/>

  <!-- Arms - armored gauntlets -->
  <rect x="330" y="162" width="26" height="55" rx="4" fill="#180a0a"/>
  <rect x="444" y="162" width="26" height="55" rx="4" fill="#180a0a"/>

  <!-- Sword raised high in right hand -->
  <line x1="462" y1="220" x2="520" y2="20" stroke="#8a9aaa" stroke-width="3" filter="url(#glowS)"/>
  <line x1="462" y1="220" x2="520" y2="20" stroke="#c8d8e8" stroke-width="1.5" opacity="0.5"/>
  <rect x="452" y="210" width="24" height="10" rx="3" fill="#2a1010" transform="rotate(-20 464 215)"/>

  <!-- Neck guard -->
  <rect x="385" y="100" width="30" height="22" rx="2" fill="#1e0c0c"/>

  <!-- Grand kabuto helmet -->
  <ellipse cx="400" cy="90" rx="36" ry="26" fill="#1e0c0c"/>
  <path d="M364 90 Q372 62 400 56 Q428 62 436 90" fill="#180a0a"/>
  <!-- Shikoro (neck guard flaps) -->
  <path d="M364 90 Q352 96 348 110 L370 105 Q366 98 364 90Z" fill="#180a0a"/>
  <path d="M436 90 Q448 96 452 110 L430 105 Q434 98 436 90Z" fill="#180a0a"/>
  <!-- Massive crescent crest (maedate) -->
  <path d="M385 57 Q370 30 360 15 Q375 35 390 54" fill="#1e0c0c" stroke="#8B1A1A" stroke-width="2"/>
  <path d="M415 57 Q430 30 440 15 Q425 35 410 54" fill="#1e0c0c" stroke="#8B1A1A" stroke-width="2"/>
  <path d="M390 54 Q400 38 410 54" fill="#8B1A1A" opacity="0.7"/>
  <!-- Gold detail on helmet -->
  <path d="M364 90 L436 90" stroke="#8B1A1A" stroke-width="2" opacity="0.5"/>

  <!-- Menpo (face mask) - fierce demon -->
  <ellipse cx="400" cy="98" rx="24" ry="20" fill="#140808"/>
  <!-- Fierce eyes - glowing red -->
  <ellipse cx="391" cy="92" rx="5" ry="3.5" fill="#8B1A1A" opacity="0.9" filter="url(#blurS)"/>
  <ellipse cx="409" cy="92" rx="5" ry="3.5" fill="#8B1A1A" opacity="0.9" filter="url(#blurS)"/>
  <ellipse cx="391" cy="92" rx="3" ry="2" fill="#c0392b"/>
  <ellipse cx="409" cy="92" rx="3" ry="2" fill="#c0392b"/>
  <!-- Demon nose/mouth -->
  <path d="M395 100 Q400 104 405 100" fill="none" stroke="#3a1010" stroke-width="1.5"/>
  <path d="M388 106 Q400 112 412 106" fill="none" stroke="#3a1010" stroke-width="2"/>

  <!-- Power aura glow -->
  <ellipse cx="400" cy="150" rx="100" ry="140" fill="#8B1A1A" opacity="0.05" filter="url(#blurS)"/>
  <ellipse cx="400" cy="260" rx="90" ry="15" fill="#8B1A1A" opacity="0.35" filter="url(#blurS)"/>

  <!-- Bottom fade -->
  <rect x="0" y="210" width="800" height="70" fill="url(#shg)" opacity="0.5"/>
</svg>
